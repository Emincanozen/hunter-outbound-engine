<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple Accent Glow -->
    <radialGradient id="purpleGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Pipeline Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <style>
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #fbbf24; letter-spacing: 1.5px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 54px; font-weight: 800; fill: url(#titleGrad); letter-spacing: -1.5px; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 400; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e2e8f0; }
    .node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Base Card Frame -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#amberGlow)"/>
  <rect width="1200" height="340" rx="16" fill="url(#purpleGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Funnel / Flow Diagram Graphic on Right Side -->
  <g transform="translate(800, 75)" opacity="0.8">
    <!-- Connecting flow track -->
    <path d="M 40 40 L 140 70 L 240 100 L 320 150" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 40 40 L 140 70 L 240 100" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" fill="none"/>

    <!-- Stage 1: Detect -->
    <g transform="translate(40, 40)">
      <circle r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <circle r="6" fill="#f59e0b"/>
      <text x="0" y="32" text-anchor="middle" class="node-label">Detect</text>
    </g>

    <!-- Stage 2: Enrich -->
    <g transform="translate(140, 70)">
      <circle r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <circle r="6" fill="#fbbf24"/>
      <text x="0" y="32" text-anchor="middle" class="node-label">Enrich</text>
    </g>

    <!-- Stage 3: Personalize -->
    <g transform="translate(240, 100)">
      <circle r="22" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
      <circle r="8" fill="#a78bfa"/>
      <text x="0" y="36" text-anchor="middle" class="node-label">Personalize</text>
    </g>

    <!-- Stage 4: Contact -->
    <g transform="translate(320, 150)">
      <circle r="20" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <circle r="7" fill="#10b981"/>
      <text x="0" y="34" text-anchor="middle" class="node-label">Contact</text>
    </g>

    <!-- Pipeline Metric Chip -->
    <g transform="translate(200, 10)">
      <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#10b981"/>
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">4-Stage Pipeline</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Architecture Tag Badge -->
    <g transform="translate(0, 0)">
      <rect width="220" height="26" rx="13" fill="#451a03" stroke="#b45309" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#fbbf24"/>
      <text x="26" y="17" class="badge-text">AETHEROS PIPELINE AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" class="title-text">Hunter</text>

    <!-- Tagline -->
    <text x="0" y="124" class="tagline-text">Autonomous B2B Outbound &amp; HyperReach™ Lead Pipeline Engine</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Next.js 16 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#ffffff"/>
        <text x="32" y="22" class="pill-text">Next.js 16.2</text>
      </g>

      <!-- Pill 2: Anthropic Claude Sonnet -->
      <g transform="translate(148, 0)">
        <rect width="194" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#d97706"/>
        <text x="32" y="22" class="pill-text">Anthropic Claude Sonnet</text>
      </g>

      <!-- Pill 3: HyperReach™ CRM -->
      <g transform="translate(352, 0)">
        <rect width="186" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#7c3aed"/>
        <text x="32" y="22" class="pill-text">HyperReach™ Pipeline</text>
      </g>

      <!-- Pill 4: Gmail Outbound Sync -->
      <g transform="translate(548, 0)">
        <rect width="176" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
        <text x="32" y="22" class="pill-text">Gmail Outbound Sync</text>
      </g>
    </g>
  </g>
</svg>
